<section id="contact" class="py-20 px-6 max-w-2xl mx-auto text-center">
  <h2 class="text-3xl font-bold font-heading text-ink mb-6">Contact</h2>

  <p class="text-muted mb-8">
    N'hésitez pas à me contacter pour toute opportunité ou question.
  </p>

  <div class="flex flex-col sm:flex-row justify-center gap-4">
    <a [href]="'mailto:' + email"
       class="px-6 py-3 rounded-lg bg-accent text-white font-medium hover:opacity-90 transition">
      M'envoyer un email
    </a>
    <a [href]="linkedinUrl" target="_blank" rel="noopener noreferrer"
       class="px-6 py-3 rounded-lg border border-ink text-ink font-medium hover:bg-ink/5 transition">
      LinkedIn
    </a>
    <a [href]="githubUrl" target="_blank" rel="noopener noreferrer"
       class="px-6 py-3 rounded-lg border border-ink text-ink font-medium hover:bg-ink/5 transition">
      GitHub
    </a>
  </div>
</section>
