<section id="competences" class="py-20 px-6 bg-surface-skills">
  <h2 class="text-3xl font-bold font-heading text-ink text-center mb-12">Compétences</h2>

  <div class="space-y-10 max-w-4xl mx-auto">
    @for (category of categories; track category.title) {
      <div>
        <h3 class="text-lg font-semibold text-muted mb-4 text-center">{{ category.title }}</h3>

        <div class="marquee-wrapper">
          <div class="marquee-track" [class.scroll-left]="category.direction === 'left'"
                                      [class.scroll-right]="category.direction === 'right'">
            @for (skill of [category.skills, category.skills]; track $index) {
              @for (item of skill; track item.name) {
                <div class="flex flex-col items-center w-20 shrink-0 mx-8">
                  <img [src]="'https://cdn.simpleicons.org/' + item.icon" [alt]="item.name" class="w-10 h-10" />
                  <span class="mt-2 text-xs text-muted text-center">{{ item.name }}</span>
                </div>
              }
            }
          </div>
        </div>
      </div>
    }
  </div>
</section>
