<section id="projets" class="py-20 px-6 max-w-5xl mx-auto">
  <h2 class="text-3xl font-bold font-heading text-ink text-center mb-12">Mes projets</h2>

  <div class="grid gap-8 md:grid-cols-2">
    @for (project of projects; track project.name) {
      <div class="border border-border hover:border-accent-secondary rounded-xl p-6 transition">
        <h3 class="text-xl font-semibold text-ink">{{ project.name }}</h3>
        <p class="mt-3 text-muted">{{ project.pitch }}</p>

        <div class="mt-4 flex flex-wrap gap-2">
          @for (tech of project.stack; track tech) {
            <span class="px-3 py-1 text-sm rounded-full bg-surface-skills text-ink">
              {{ tech }}
            </span>
          }
        </div>

        <a [href]="project.demoUrl" target="_blank" rel="noopener noreferrer"
           class="mt-5 inline-block text-sm font-medium text-ink underline hover:text-accent-secondary">
          Voir la démo →
        </a>
      </div>
    }
  </div>
</section>
