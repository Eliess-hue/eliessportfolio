<section id="projets" class="py-20 px-6 max-w-5xl mx-auto">
  <h2 class="text-3xl font-bold text-center text-gray-900 mb-12">Mes projets</h2>

  <div class="grid gap-8 md:grid-cols-2">
    @for (project of projects; track project.name) {
      <div class="border border-gray-200 rounded-xl p-6 shadow-sm hover:shadow-md transition">
        <h3 class="text-xl font-semibold text-gray-900">{{ project.name }}</h3>
        <p class="mt-3 text-gray-600">{{ project.pitch }}</p>

        <div class="mt-4 flex flex-wrap gap-2">
          @for (tech of project.stack; track tech) {
            <span class="px-3 py-1 text-sm rounded-full bg-gray-100 text-gray-700">
              {{ tech }}
            </span>
          }
        </div>

        <a [href]="project.demoUrl" target="_blank" rel="noopener noreferrer"
           class="mt-5 inline-block text-sm font-medium text-gray-900 underline hover:text-gray-600">
          Voir la démo →
        </a>
      </div>
    }
  </div>
</section>
